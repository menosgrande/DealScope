<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DealScope — 4人トーナメント</title>
<style>
:root{--felt:#0e2f26;--felt2:#143d32;--line:#2a5a4b;--ivory:#f3efe3;--mute:#8fb0a3;--brass:#d8b252;--red:#d55b63}
*{box-sizing:border-box}html,body{margin:0;background:var(--felt);color:var(--ivory);font-family:system-ui,"Yu Gothic UI","Noto Sans JP",sans-serif}
main{max-width:560px;margin:auto;padding:14px 12px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:16px;margin:0}.back{color:var(--mute);text-decoration:none;font-size:12px}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--felt2);padding:10px;margin-bottom:10px}
.info{font-size:12px;color:var(--mute);text-align:center}.msg{text-align:center;font-size:14px;min-height:24px;margin:6px 0;color:var(--ivory)}
.board{min-height:78px;display:flex;align-items:center;justify-content:center;gap:7px;margin:8px 0}.empty{font-size:30px;color:var(--line)}
.card{display:inline-flex;width:43px;height:60px;border-radius:7px;background:var(--ivory);color:#111;align-items:center;justify-content:center;font-size:20px;font-weight:750;box-shadow:0 2px 5px #0005}.card.red{color:#bd343d}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{position:relative;min-height:125px;border:1px solid var(--line);border-radius:10px;padding:9px;background:#0c2921}.player.hero{border-color:var(--brass)}.player.out{opacity:.42}
.phead{display:flex;align-items:center;gap:5px;font-size:12px}.phead i{width:8px;height:8px;border-radius:50%;display:inline-block}.phead small{margin-left:auto;color:var(--mute);font-size:10px}.cards{height:68px;display:flex;align-items:center;justify-content:center;gap:5px}.back{display:inline-flex;width:38px;height:54px;border:1px solid var(--brass);border-radius:6px;align-items:center;justify-content:center;color:var(--brass);background:#163d31}.stack{text-align:center;font-size:15px;font-weight:700}.stack small{font-size:9px;color:var(--mute);font-weight:400}.made{text-align:center;color:var(--brass);font-size:10px;margin-top:3px}
.log{max-height:125px;overflow:auto;font-size:11px;color:var(--mute);line-height:1.7}.log b{color:var(--ivory)}
.hint{text-align:center;color:var(--mute);font-size:11px;min-height:18px;margin:7px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{height:42px;border:1px solid var(--line);border-radius:9px;background:#173e32;color:var(--ivory);font-weight:700}.actions button:disabled{opacity:.3}.actions .fold{color:#e29ba2}.actions .primary{background:var(--brass);color:#17140d;border-color:var(--brass)}
.amount{display:flex;gap:7px;margin-bottom:7px}.amount input{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;background:#092219;color:var(--ivory);padding:0 10px;font-size:14px}.new{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--mute);margin-top:8px}
.note{font-size:10px;color:var(--mute);line-height:1.6;margin-top:12px}
#advancedSetup{margin:8px 0 12px;font-size:12px;color:var(--mute)}#stackFields{display:grid;gap:7px;margin-top:8px}.stackField{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:8px;font-size:12px}.stackField input{width:100%;height:34px;background:#092219;color:var(--ivory);border:1px solid var(--line);border-radius:7px;padding:0 8px}#bridgeSetup .actions{margin-top:10px}#bridgeSetup .actions button{min-width:0}#setupError{color:#ff9ba2}
@media(max-width:390px){main{padding-left:8px;padding-right:8px}.card{width:39px;height:56px}.players{gap:5px}.player{padding:7px}.phead small{font-size:9px}.actions button{height:40px}}
</style>
</head>
<body>
<main>
<div class="top"><h1>DealScope / 4人トーナメント</h1><a class="back" id="backLink" href="./">← Calculator</a></div>
<div class="panel" id="bridgeSetup" hidden>
  <div class="msg">解析局面から開始</div>
  <p class="note" id="setupSummary"></p>
  <p class="note" id="setupDefaultPot"></p>
  <details id="advancedSetup"><summary>詳細設定（残りスタック・開始ポット）</summary>
  <label class="note" for="setupPot">開始ポット</label><input id="setupPot" type="number" min="0" max="1000000000" step="1" value="10000" style="width:100%;height:38px;margin:5px 0 10px;background:#092219;color:var(--ivory);border:1px solid var(--line);border-radius:8px;padding:0 10px">
  <div id="stackFields"></div><p class="note">開始ポットは過去のベット履歴を再現せず、独立した共通ポットとして扱います。</p></details>
  <p class="note" id="setupError" role="alert" hidden></p>
  <div class="actions"><button id="startImported" class="primary">この設定で開始</button><button id="cancelImported">解析画面へ戻る</button></div>
</div>
<div class="panel" id="gamePanel">
  <div id="info" class="info"></div>
  <div id="msg" class="msg"></div>
  <div id="board" class="board"></div>
  <div id="players" class="players"></div>
</div>
<div class="panel" id="actionPanel">
  <div class="hint" id="hint"></div>
  <div class="amount"><input id="amount" type="number" step="10" min="20" value="20" aria-label="ベットまたはレイズ額"></div>
  <div class="actions">
    <button id="foldBtn" class="fold">フォールド</button>
    <button id="callBtn">チェック</button>
    <button id="betBtn" class="primary">ベット</button>
    <button id="allinBtn">オールイン</button>
  </div>
  <button id="nextHandBtn" class="new" hidden>次のハンドへ</button><button id="returnAnalysisBtn" class="new" hidden>解析画面へ戻る</button>
  <button id="newBtn" class="new">最初からやり直す</button>
</div>
<div class="panel log" id="logPanel"><div id="log"></div></div>
<p class="note">これはDealScope本体とは別の遊び用ミニゲームです。CPUはGTO解ではなく、TAG / LAG / タイト・パッシブ / ルーズ・パッシブの傾向を、ハンド強度・ボード・ポット・スタック・確率的な揺らぎに反映します。</p>
</main>
<script src="./engine.js"></script>
<script src="./minigame.js"></script>
</body>
</html>
