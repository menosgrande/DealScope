name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression checks
        run: node ci/verify.js
      - name: Run browser regression checks
        run: node ci/browser-verify.js
      - name: Run analysis-to-mini-game bridge checks
        run: node tests/analysis-minigame-bridge.test.cjs
