<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DealScope browser regression</title></head>
<body>
<div id="status">RUNNING</div>
<iframe id="app" src="/index.html#AsKd-??/2c7h9d" style="width:390px;height:1200px;border:0"></iframe>
<script>
(async function () {
  const status = document.getElementById('status');
  const frame = document.getElementById('app');
  const frameErrors = [];
  const frameWindow = frame.contentWindow;
  frameWindow.addEventListener('error', (e) => {
    frameErrors.push('error: ' + (e.message || 'unknown') + (e.filename || '') + ':' + (e.lineno || 0));
  });
  frameWindow.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    frameErrors.push('unhandledrejection: ' + (r && r.message ? r.message : String(r)));
  });

  function fail(message) {
    status.textContent = 'FAIL: ' + message;
    document.title = 'FAIL';
    if (frameErrors.length) status.textContent += ' [' + frameErrors.join(' | ') + ']';
  }

  let waitForIndex = 0;
  function waitFor(getter, timeout) {
    timeout = timeout || 5000;
    const waitIndex = ++waitForIndex;
    const start = performance.now();
    return new Promise((resolve, reject) => {
      (function poll() {
        try {
          const value = getter();
          if (value) return resolve(value);
        } catch (_) {}
        if (performance.now() - start >= timeout) return reject(new Error('timeout at waitFor #' + waitIndex));
        setTimeout(poll, 50);
      })();
    });
  }

  async function waitFrameLoad() {
    if (frame.contentDocument && frame.contentDocument.readyState === 'complete'
        && frame.contentWindow.location.href !== 'about:blank') return;
    await new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  }

  try {
    await waitFrameLoad();
    const doc = frame.contentDocument;
    await waitFor(() => doc && doc.querySelector('#potOddsBox'));
    const details = doc.querySelector('#potOddsBox');
    if (!details || details.open) throw new Error('Pot Odds should be collapsed by default');
    details.querySelector('summary').click();
    await waitFor(() => doc.querySelector('#potInput'));
    frame.contentWindow.localStorage.removeItem('dealscope-pot-odds-v1');

    const pot = doc.querySelector('#potInput');
    const call = doc.querySelector('#callInput');
    if (!pot || !call) throw new Error('Pot Odds inputs not rendered');

    pot.value = '100';
    pot.dispatchEvent(new Event('input', {bubbles:true}));
    call.value = '30';
    call.dispatchEvent(new Event('input', {bubbles:true}));

    await waitFor(() => {
      const el = doc.querySelector('[data-pot-result="required"]');
      return el && el.textContent === '23.1%';
    });

    const potPlus10 = doc.querySelector('[data-pot-key="pot"][data-pot-step="10"]');
    const potMinus10 = doc.querySelector('[data-pot-key="pot"][data-pot-step="-10"]');
    if (!potPlus10 || !potMinus10) throw new Error('Pot 10-step controls are missing');
    potPlus10.click();
    if (doc.querySelector('#potInput').value !== '110') throw new Error('Pot +10 did not reach 110');
    potMinus10.click();
    if (doc.querySelector('#potInput').value !== '100') throw new Error('Pot -10 did not return to 100');

    const callPlus10 = doc.querySelector('[data-pot-key="call"][data-pot-step="10"]');
    const callMinus10 = doc.querySelector('[data-pot-key="call"][data-pot-step="-10"]');
    if (!callPlus10 || !callMinus10) throw new Error('Call 10-step controls are missing');
    callPlus10.click();
    if (doc.querySelector('#callInput').value !== '40') throw new Error('Call +10 did not reach 40');
    callMinus10.click();
    if (doc.querySelector('#callInput').value !== '30') throw new Error('Call -10 did not return to 30');

    await waitFor(() => {
      const el = doc.querySelector('[data-pot-result="required"]');
      return el && el.textContent === '23.1%';
    });

    const saved = JSON.parse(frame.contentWindow.localStorage.getItem('dealscope-pot-odds-v1') || '{}');
    if (saved.pot !== '100' || saved.call !== '30') throw new Error('Pot Odds values were not persisted');

    const reload = new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
    frame.contentWindow.location.reload();
    await reload;
    const after = frame.contentDocument;
    await waitFor(() => after && after.querySelector('#potOddsBox'));
    const afterDetails = after.querySelector('#potOddsBox');
    if (!afterDetails || afterDetails.open) throw new Error('Pot Odds should reload collapsed');
    afterDetails.querySelector('summary').click();
    await waitFor(() => after.querySelector('#potInput'));

    const potAfter = after.querySelector('#potInput');
    const callAfter = after.querySelector('#callInput');
    const requiredAfter = after.querySelector('[data-pot-result="required"]');
    if (!potAfter || !callAfter || !requiredAfter) throw new Error('Pot Odds did not restore');
    if (potAfter.value !== '100' || callAfter.value !== '30') throw new Error('saved Pot/Call values were not restored');
    if (requiredAfter.textContent !== '23.1%') throw new Error('restored Required Equity is wrong');

    const mini = document.createElement('iframe');
    mini.id = 'mini';
    mini.src = '/minigame/index.html';
    mini.style = 'width:390px;height:1200px;border:0;position:absolute;left:-9999px';
    document.body.appendChild(mini);
    await new Promise(resolve => mini.addEventListener('load', resolve, {once:true}));
    const md = mini.contentDocument;
    await waitFor(() => md && md.querySelector('#turnLabel'), 4000);
    const actionCostSummary = md.querySelector('.actionCostSummary');
    if (!actionCostSummary || !md.querySelector('#callAfterStack') || !md.querySelector('#raiseAfterStack')) throw new Error('action cost and remaining stack summary is missing');
    const slider = md.querySelector('#amountSlider');
    const amountValue = md.querySelector('#amount');
    const amountReadout = md.querySelector('#amountReadout');
    const minusStep = md.querySelector('#minusStep');
    const plusStep = md.querySelector('#plusStep');
    const stepLabel = md.querySelector('#stepLabel');
    const betButton = md.querySelector('#betBtn');
    if (!slider || slider.type !== 'range' || !amountValue || !amountReadout) throw new Error('bet sizing slider is missing');
    if (!minusStep || !plusStep || !stepLabel || !betButton) throw new Error('bet sizing adjustment controls are missing');
    slider.value = String(Math.min(Number(slider.max), Number(slider.min) + Number(slider.step)));
    slider.dispatchEvent(new md.defaultView.Event('input', {bubbles:true}));
    if (amountValue.value !== slider.value) throw new Error('slider value did not update action amount');
    if (!md.querySelector('#raiseAfterStack').textContent.includes('/')) throw new Error('raise sizing should show added amount and remaining stack');
    if (amountReadout.textContent !== Number(slider.value).toLocaleString('ja-JP')) throw new Error('slider amount readout did not update');
    if (!betButton.textContent.includes(Number(slider.value).toLocaleString('ja-JP'))) throw new Error('bet action label did not follow slider value');
    if (!stepLabel.textContent.includes(Number(slider.step).toLocaleString('ja-JP'))) throw new Error('slider increment label did not update');
    if (md.querySelectorAll('.player .equityDetails').length !== 0) {
      throw new Error('equity information should not be embedded in player cards');
    }
    const heroAnalysis = md.querySelector('#heroAnalysis');
    const players = md.querySelector('#players');
    if (!heroAnalysis || !players || heroAnalysis.parentElement !== players.parentElement) {
      throw new Error('hero analysis should occupy a separate column beside the player list');
    }
    const analysisLink = md.querySelector('#openCalculator');
    if (!analysisLink || analysisLink.target !== '_blank' || !analysisLink.textContent.includes('分析')) {
      throw new Error('central analysis should open the equity calculator in a new tab');
    }
    const analysisUrl = new URL(analysisLink.href, md.location.href);
    if (analysisUrl.pathname !== '/index.html') throw new Error('analysis link should target the main calculator');
    const transferred = frameWindow.DealState.decode(analysisUrl.hash);
    if (!transferred || transferred.mode !== 'random' || transferred.opp !== 3) {
      throw new Error('analysis URL should request three random opponents');
    }
    function visibleCardCode(node) {
      const rank = node.querySelector('.rank');
      const suit = node.querySelector('.suit');
      const suitCode = {'♠':'s','♥':'h','♦':'d','♣':'c'};
      if (!rank || !suit) throw new Error('visible card is missing rank or suit');
      const ranks = '23456789TJQKA';
      const r = ranks.indexOf(rank.textContent.trim());
      const s = suitCode[suit.textContent.trim()];
      if (r < 0 || !s) throw new Error('visible card could not be encoded');
      return r * 4 + 'shdc'.indexOf(s);
    }
    const shownHeroHand = Array.from(md.querySelectorAll('#players .player.hero .cards .card')).map(visibleCardCode);
    const shownBoard = Array.from(md.querySelectorAll('#board .card')).map(visibleCardCode);
    if (shownHeroHand.length !== 2 || transferred.players[0][0] !== shownHeroHand[0] || transferred.players[0][1] !== shownHeroHand[1]) {
      throw new Error('analysis URL did not preserve the Hero hand');
    }
    if (JSON.stringify(transferred.board.filter(card => card >= 0)) !== JSON.stringify(shownBoard)) {
      throw new Error('analysis URL did not preserve the public board');
    }
    if (!analysisUrl.hash.includes('-??-??-??')) throw new Error('unknown opponents should remain hidden in the analysis URL');

    mini.style.width = '900px';
    const playGrid = md.defaultView.getComputedStyle(md.querySelector('.playArea'));
    if (playGrid.gridTemplateColumns.trim().split(/\s+/).length !== 2) {
      throw new Error('desktop should place the player strip above action and analysis panels');
    }
    const desktopGrid = md.defaultView.getComputedStyle(md.querySelector('#players'));
    if (desktopGrid.gridTemplateColumns.trim().split(/\s+/).length !== 3) {
      throw new Error('desktop opponents should use a horizontal three-column strip');
    }
    const boardHistory = md.querySelector('.boardHistoryRow');
    if (!boardHistory || !md.querySelector('.boardFocus #board') || !md.querySelector('.boardHistoryRow #log')) {
      throw new Error('board/pot and action history should share the upper play area');
    }
    if (md.defaultView.getComputedStyle(md.querySelector('#turnHeroCards')).display === 'none') {
      throw new Error('hero hole cards should remain visible beside action controls');
    }
    mini.style.width = '390px';
    const mobileGrid = md.defaultView.getComputedStyle(md.querySelector('#players'));
    if (mobileGrid.gridTemplateColumns.trim().split(/\s+/).length !== 3) {
      throw new Error('mobile opponents should remain in a compact horizontal strip');
    }
    if (md.defaultView.getComputedStyle(md.querySelector('.turnDecisionHeader')).display === 'none') {
      throw new Error('mobile action panel should keep hero cards and call context visible');
    }

    // Responsive smoke checks at the supported phone widths. Use a phone-like
    // viewport height as well, so the test exercises vertical scrolling and reachability.
    mini.style.height = '700px';
    frame.style.height = '700px';
    for (const width of [320, 375, 390, 430]) {
      mini.style.width = width + 'px';
      frame.style.width = width + 'px';
      await new Promise(resolve => setTimeout(resolve, 50));
      if (md.defaultView.innerHeight < 600 || md.documentElement.scrollHeight <= md.defaultView.innerHeight) {
        throw new Error('mini-game should provide a vertically scrollable page at ' + width + 'px');
      }
      if (md.documentElement.scrollWidth > width + 1 || md.body.scrollWidth > width + 1) {
        throw new Error('mini-game horizontal overflow at ' + width + 'px: document='
          + md.documentElement.scrollWidth + ', body=' + md.body.scrollWidth);
      }
      if (doc.documentElement.scrollWidth > width + 1 || doc.body.scrollWidth > width + 1) {
        throw new Error('calculator horizontal overflow at ' + width + 'px: document='
          + doc.documentElement.scrollWidth + ', body=' + doc.body.scrollWidth);
      }
      const visibleControls = Array.from(md.querySelectorAll('#foldBtn, #callBtn, #betBtn, #amountSlider, #players, #board'))
        .filter(el => el.getClientRects().length);
      for (const el of visibleControls) {
        const rect = el.getBoundingClientRect();
        if (rect.left < -1 || rect.right > width + 1) {
          throw new Error('mini-game control ' + (el.id || el.className) + ' clipped at ' + width + 'px');
        }
      }
      function overlaps(a, b) {
        const x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
        return Math.min(x.right, y.right) - Math.max(x.left, y.left) > 1
          && Math.min(x.bottom, y.bottom) - Math.max(x.top, y.top) > 1;
      }
      const regions = [md.querySelector('#players'), md.querySelector('#heroAnalysis'), md.querySelector('.turnPanel')]
        .filter(el => el && el.getClientRects().length);
      for (let i = 0; i < regions.length; i++) {
        for (let j = i + 1; j < regions.length; j++) {
          if (overlaps(regions[i], regions[j])) {
            throw new Error('mini-game major regions overlap at ' + width + 'px: '
              + (regions[i].id || regions[i].className) + ' / ' + (regions[j].id || regions[j].className));
          }
        }
      }
      const seats = Array.from(md.querySelectorAll('#players .player')).filter(el => el.getClientRects().length);
      if (seats.length !== 4) throw new Error('expected four visible player seats at ' + width + 'px');
      for (let i = 0; i < seats.length; i++) {
        for (let j = i + 1; j < seats.length; j++) {
          if (overlaps(seats[i], seats[j])) throw new Error('player seats overlap at ' + width + 'px');
        }
      }
      const actionButtons = ['#foldBtn', '#callBtn', '#betBtn'].map(s => md.querySelector(s))
        .filter(el => el && el.getClientRects().length);
      for (let i = 0; i < actionButtons.length; i++) {
        for (let j = i + 1; j < actionButtons.length; j++) {
          if (overlaps(actionButtons[i], actionButtons[j])) throw new Error('action buttons overlap at ' + width + 'px');
        }
      }
      // WCAG 2.2 target-size minimum is 24x24 CSS px (subject to defined exceptions).
      // Check the frequently tapped game controls at every supported phone width.
      const tapTargets = Array.from(md.querySelectorAll(
        '#foldBtn, #callBtn, #betBtn, #allinBtn, #minusStep, #plusStep, #nextBtn, #newBtn'
      )).filter(el => el.getClientRects().length && md.defaultView.getComputedStyle(el).display !== 'none');
      for (const el of tapTargets) {
        const rect = el.getBoundingClientRect();
        if (rect.width < 24 || rect.height < 24) {
          throw new Error('tap target below 24x24 CSS px at ' + width + 'px: '
            + (el.id || el.className) + ' (' + rect.width + 'x' + rect.height + ')');
        }
        el.scrollIntoView({ block: 'center' });
        const reachable = el.getBoundingClientRect();
        if (reachable.top < -1 || reachable.bottom > md.defaultView.innerHeight + 1) {
          throw new Error('tap target cannot be brought into the phone viewport by scrolling at '
            + width + 'px: ' + (el.id || el.className));
        }
      }
      const heroCards = Array.from(md.querySelectorAll('#turnHeroCards .card'))
        .filter(el => el.getClientRects().length);
      if (heroCards.length !== 2) throw new Error('Hero hole cards missing beside action controls at ' + width + 'px');
      const visibleCards = Array.from(md.querySelectorAll('#players .player .cards .card, #board .card'))
        .filter(el => el.getClientRects().length);
      if (visibleCards.length < 2) throw new Error('mini-game cards missing at ' + width + 'px');
      for (const card of visibleCards) {
        const rect = card.getBoundingClientRect();
        if (rect.left < -1 || rect.right > width + 1 || rect.width <= 0 || rect.height <= 0) {
          throw new Error('mini-game card clipped or collapsed at ' + width + 'px');
        }
      }
    }
    mini.style.width = '390px';
    frame.style.width = '390px';
    mini.style.height = '1200px';
    frame.style.height = '1200px';

    const glossaryFrame = document.createElement('iframe');
    glossaryFrame.id = 'glossary';
    glossaryFrame.src = '/glossary.html';
    glossaryFrame.style = 'width:390px;height:1000px;border:0;position:absolute;left:-9999px';
    const glossaryLoaded = new Promise(resolve => glossaryFrame.addEventListener('load', resolve, {once:true}));
    document.body.appendChild(glossaryFrame);
    await glossaryLoaded;
    const gd = glossaryFrame.contentDocument;
    await waitFor(() => gd && gd.querySelector('#search') && gd.querySelector('#terms .term'), 5000);
    const glossaryTerms = gd.querySelectorAll('#terms .term');
    if (glossaryTerms.length < 250) throw new Error('glossary should show the full vocabulary list on load');
    const glossarySearch = gd.querySelector('#search');
    glossarySearch.value = 'サイドポット';
    glossarySearch.dispatchEvent(new glossaryFrame.contentWindow.Event('input', {bubbles:true}));
    await waitFor(() => gd.querySelectorAll('#terms .term').length > 0, 2000);
    if (!Array.from(gd.querySelectorAll('#terms .term')).some(el => el.querySelector('h3').textContent === 'サイドポット')) {
      throw new Error('glossary Japanese search did not find side pot');
    }
    glossarySearch.value = 'Equity';
    glossarySearch.dispatchEvent(new glossaryFrame.contentWindow.Event('input', {bubbles:true}));
    await waitFor(() => gd.querySelectorAll('#terms .term').length > 0, 2000);
    if (!Array.from(gd.querySelectorAll('#terms .term')).some(el => el.textContent.includes('エクイティ'))) {
      throw new Error('glossary English search did not find equity');
    }
    glossarySearch.value = '';
    glossarySearch.dispatchEvent(new glossaryFrame.contentWindow.Event('input', {bubbles:true}));
    const glossaryCategory = gd.querySelector('#category');
    glossaryCategory.value = 'アクション';
    glossaryCategory.dispatchEvent(new glossaryFrame.contentWindow.Event('change', {bubbles:true}));
    if (!Array.from(gd.querySelectorAll('#terms .term')).every(el => el.querySelector('.category').textContent === 'アクション')) {
      throw new Error('glossary category filter did not restrict the list');
    }
    glossaryCategory.value = '';
    glossaryCategory.dispatchEvent(new glossaryFrame.contentWindow.Event('change', {bubbles:true}));
    gd.querySelector('[data-stars="5"]').click();
    if (!Array.from(gd.querySelectorAll('#terms .term')).every(el => el.querySelector('.stars').getAttribute('aria-label') === '重要度 5 / 5')) {
      throw new Error('glossary importance-star filter did not restrict the list');
    }
    glossaryFrame.remove();

    /* Exercise a real imported river scenario in Chromium and verify the whole chip pool. */
    const settlementPayload = {
      version: 1,
      snapshot: {
        mode: 'known', n: 2, opp: 1,
        players: [[0, 4], [8, 12], [32, 36], [40, 48]],
        board: [16, 20, 24, 40, 44]
      },
      equity: [60, 40], approx: false, activeCount: 2, createdAt: 1,
      settings: { stack: 1000, smallBlind: 100, bigBlind: 200, startPot: 1000 }
    };
    sessionStorage.setItem('dealscope-analysis-game-v1', JSON.stringify(settlementPayload));
    const settlementFrame = document.createElement('iframe');
    settlementFrame.id = 'settlement';
    settlementFrame.src = '/minigame/index.html';
    settlementFrame.style = 'width:390px;height:1200px;border:0;position:absolute;left:-9999px';
    const settlementLoaded = new Promise(resolve => settlementFrame.addEventListener('load', resolve, {once:true}));
    document.body.appendChild(settlementFrame);
    await settlementLoaded;
    const sd = settlementFrame.contentDocument;
    await waitFor(() => sd && sd.querySelector('#turnLabel'), 5000);
    if (sd.querySelector('#potValue').textContent !== '1,000') {
      throw new Error('imported starting pot was not shown in the real mini-game');
    }

    const settleDeadline = performance.now() + 20000;
    let settleActions = 0;
    while (performance.now() < settleDeadline) {
      const next = sd.querySelector('#nextBtn');
      if (next && next.style.display === 'block') break;
      const callButton = sd.querySelector('#callBtn');
      const foldButton = sd.querySelector('#foldBtn');
      /* Prefer Check/Call so the test never depends on the All-in confirmation dialog. */
      if (callButton && !callButton.disabled) {
        callButton.click();
        settleActions++;
      } else if (foldButton && !foldButton.disabled) {
        foldButton.click();
        settleActions++;
      }
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    if (sd.querySelector('#nextBtn').style.display !== 'block') {
      throw new Error('imported river hand did not reach a completed result');
    }
    if (settleActions < 1) throw new Error('browser settlement test did not perform a player action');
    if (sd.querySelector('#potValue').textContent !== '0') {
      throw new Error('displayed pot was not cleared after settlement');
    }
    const displayedStacks = Array.from(sd.querySelectorAll('#players .player .stack b'))
      .map(el => Number(el.textContent.replace(/,/g, '')));
    if (displayedStacks.length !== 4 || displayedStacks.reduce((sum, n) => sum + n, 0) !== 5000) {
      throw new Error('stack total did not conserve the 4,000 starting chips plus 1,000 imported pot');
    }
    settlementFrame.remove();

    /* A fresh random game must finish a normal hand and advance to the next hand. */
    const freshGame = document.createElement('iframe');
    freshGame.id = 'freshGame';
    freshGame.src = '/minigame/index.html';
    freshGame.style = 'width:390px;height:1200px;border:0;position:absolute;left:-9999px';
    const freshLoaded = new Promise(resolve => freshGame.addEventListener('load', resolve, {once:true}));
    document.body.appendChild(freshGame);
    await freshLoaded;
    const fd = freshGame.contentDocument;
    await waitFor(() => fd && fd.querySelector('#turnLabel') && fd.querySelectorAll('#players .player').length === 4, 5000);
    const freshDeadline = performance.now() + 30000;
    let freshActions = 0;
    while (performance.now() < freshDeadline) {
      const next = fd.querySelector('#nextBtn');
      if (next && next.style.display === 'block') break;
      const callButton = fd.querySelector('#callBtn');
      const foldButton = fd.querySelector('#foldBtn');
      if (callButton && !callButton.disabled) {
        callButton.click();
        freshActions++;
      } else if (foldButton && !foldButton.disabled) {
        foldButton.click();
        freshActions++;
      }
      await new Promise(resolve => setTimeout(resolve, 75));
    }
    if (fd.querySelector('#nextBtn').style.display !== 'block') {
      throw new Error('fresh random game did not finish a normal hand within 30 seconds');
    }
    if (freshActions < 1) throw new Error('fresh game did not accept a player action');
    if (fd.querySelector('#potValue').textContent !== '0') {
      throw new Error('fresh game did not clear the pot after the hand');
    }
    fd.querySelector('#nextBtn').click();
    await waitFor(() => fd.querySelector('#info').textContent.includes('Hand #2'), 5000);
    if (fd.querySelectorAll('#players .player').length !== 4) {
      throw new Error('fresh game did not redeal four player seats for Hand #2');
    }
    freshGame.remove();

    status.textContent = 'PASS';
    document.title = 'PASS';
  } catch (e) {
    fail(e && e.message ? e.message : String(e));
  }
})();
</script>
</body>
</html>
