<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DealScope browser regression</title></head>
<body>
<div id="status">RUNNING</div>
<iframe id="app" src="/index.html#AsKd-??/2c7h9d" style="width:390px;height:1200px;border:0"></iframe>
<script>
(async function () {
  const status = document.getElementById('status');
  const frame = document.getElementById('app');
  const frameErrors = [];
  const frameWindow = frame.contentWindow;
  frameWindow.addEventListener('error', (e) => {
    frameErrors.push('error: ' + (e.message || 'unknown') + (e.filename || '') + ':' + (e.lineno || 0));
  });
  frameWindow.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    frameErrors.push('unhandledrejection: ' + (r && r.message ? r.message : String(r)));
  });

  function fail(message) {
    status.textContent = 'FAIL: ' + message;
    document.title = 'FAIL';
    if (frameErrors.length) status.textContent += ' [' + frameErrors.join(' | ') + ']';
  }

  function waitFor(getter, timeout) {
    timeout = timeout || 5000;
    const start = performance.now();
    return new Promise((resolve, reject) => {
      (function poll() {
        try {
          const value = getter();
          if (value) return resolve(value);
        } catch (_) {}
        if (performance.now() - start >= timeout) return reject(new Error('timeout'));
        setTimeout(poll, 50);
      })();
    });
  }

  async function waitFrameLoad() {
    if (frame.contentDocument && frame.contentDocument.readyState === 'complete'
        && frame.contentWindow.location.href !== 'about:blank') return;
    await new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  }

  try {
    await waitFrameLoad();
    const doc = frame.contentDocument;
    await waitFor(() => doc && doc.querySelector('#potOddsBox'));
    const details = doc.querySelector('#potOddsBox');
    if (!details || details.open) throw new Error('Pot Odds should be collapsed by default');
    details.querySelector('summary').click();
    await waitFor(() => doc.querySelector('#potInput'));
    frame.contentWindow.localStorage.removeItem('dealscope-pot-odds-v1');

    const pot = doc.querySelector('#potInput');
    const call = doc.querySelector('#callInput');
    if (!pot || !call) throw new Error('Pot Odds inputs not rendered');

    pot.value = '100';
    pot.dispatchEvent(new Event('input', {bubbles:true}));
    call.value = '30';
    call.dispatchEvent(new Event('input', {bubbles:true}));

    await waitFor(() => {
      const el = doc.querySelector('[data-pot-result="required"]');
      return el && el.textContent === '23.1%';
    });

    const potPlus10 = doc.querySelector('[data-pot-key="pot"][data-pot-step="10"]');
    const potMinus10 = doc.querySelector('[data-pot-key="pot"][data-pot-step="-10"]');
    if (!potPlus10 || !potMinus10) throw new Error('Pot 10-step controls are missing');
    potPlus10.click();
    if (doc.querySelector('#potInput').value !== '110') throw new Error('Pot +10 did not reach 110');
    potMinus10.click();
    if (doc.querySelector('#potInput').value !== '100') throw new Error('Pot -10 did not return to 100');

    const callPlus10 = doc.querySelector('[data-pot-key="call"][data-pot-step="10"]');
    const callMinus10 = doc.querySelector('[data-pot-key="call"][data-pot-step="-10"]');
    if (!callPlus10 || !callMinus10) throw new Error('Call 10-step controls are missing');
    callPlus10.click();
    if (doc.querySelector('#callInput').value !== '40') throw new Error('Call +10 did not reach 40');
    callMinus10.click();
    if (doc.querySelector('#callInput').value !== '30') throw new Error('Call -10 did not return to 30');

    await waitFor(() => {
      const el = doc.querySelector('[data-pot-result="required"]');
      return el && el.textContent === '23.1%';
    });

    const saved = JSON.parse(frame.contentWindow.localStorage.getItem('dealscope-pot-odds-v1') || '{}');
    if (saved.pot !== '100' || saved.call !== '30') throw new Error('Pot Odds values were not persisted');

    const reload = new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
    frame.contentWindow.location.reload();
    await reload;
    const after = frame.contentDocument;
    await waitFor(() => after && after.querySelector('#potOddsBox'));
    const afterDetails = after.querySelector('#potOddsBox');
    if (!afterDetails || afterDetails.open) throw new Error('Pot Odds should reload collapsed');
    afterDetails.querySelector('summary').click();
    await waitFor(() => after.querySelector('#potInput'));

    const potAfter = after.querySelector('#potInput');
    const callAfter = after.querySelector('#callInput');
    const requiredAfter = after.querySelector('[data-pot-result="required"]');
    if (!potAfter || !callAfter || !requiredAfter) throw new Error('Pot Odds did not restore');
    if (potAfter.value !== '100' || callAfter.value !== '30') throw new Error('saved Pot/Call values were not restored');
    if (requiredAfter.textContent !== '23.1%') throw new Error('restored Required Equity is wrong');

    const mini = document.createElement('iframe');
    mini.id = 'mini';
    mini.src = '/minigame/index.html';
    mini.style = 'width:390px;height:1200px;border:0;position:absolute;left:-9999px';
    document.body.appendChild(mini);
    await new Promise(resolve => mini.addEventListener('load', resolve, {once:true}));
    const md = mini.contentDocument;
    await waitFor(() => md && md.querySelector('#turnLabel'), 4000);
    let seenHands = 0;
    const miniStart = performance.now();
    while (seenHands < 3 && performance.now() - miniStart < 12000) {
      await new Promise(resolve => setTimeout(resolve, 40));
      const info = md.querySelector('#info');
      const m = info && info.textContent.match(/Hand #(\d+)/);
      if (m) seenHands = Math.max(seenHands, Number(m[1]));
      const next = md.querySelector('#nextBtn');
      if (next && getComputedStyle(next).display !== 'none') { next.click(); continue; }
      const turn = md.querySelector('#turnLabel');
      if (turn && turn.textContent === 'あなたの番') {
        const call = md.querySelector('#callBtn');
        const allin = md.querySelector('#allinBtn');
        if (call && !call.disabled) call.click();
        else if (allin && !allin.disabled) allin.click();
      }
    }
    if (seenHands < 3) throw new Error('mini game stalled before Hand 3');
    status.textContent = 'PASS';
    document.title = 'PASS';
  } catch (e) {
    fail(e && e.message ? e.message : String(e));
  }
})();
</script>
</body>
</html>
