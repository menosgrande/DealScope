<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DealScope browser regression</title></head>
<body>
<div id="status">RUNNING</div>
<iframe id="app" src="/index.html#AsKd-??/2c7h9d" style="width:390px;height:1200px;border:0"></iframe>
<script>
(async function () {
  const status = document.getElementById('status');
  const frame = document.getElementById('app');
  const frameErrors = [];
  const frameWindow = frame.contentWindow;
  frameWindow.addEventListener('error', (e) => {
    frameErrors.push('error: ' + (e.message || 'unknown') + (e.filename || '') + ':' + (e.lineno || 0));
  });
  frameWindow.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    frameErrors.push('unhandledrejection: ' + (r && r.message ? r.message : String(r)));
  });

  function fail(message) {
    status.textContent = 'FAIL: ' + message;
    document.title = 'FAIL';
    if (frameErrors.length) status.textContent += ' [' + frameErrors.join(' | ') + ']';
  }

  function waitFor(getter, timeout) {
    timeout = timeout || 5000;
    const start = performance.now();
    return new Promise((resolve, reject) => {
      (function poll() {
        try {
          const value = getter();
          if (value) return resolve(value);
        } catch (_) {}
        if (performance.now() - start >= timeout) return reject(new Error('timeout'));
        setTimeout(poll, 50);
      })();
    });
  }

  async function waitFrameLoad() {
    if (frame.contentDocument && frame.contentDocument.readyState === 'complete'
        && frame.contentWindow.location.href !== 'about:blank') return;
    await new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  }

  try {
    await waitFrameLoad();
    const doc = frame.contentDocument;
    await waitFor(() => doc && doc.querySelector('#potOddsBox'));
    const details = doc.querySelector('#potOddsBox');
    if (!details || details.open) throw new Error('Pot Odds should be collapsed by default');
    details.querySelector('summary').click();
    await waitFor(() => doc.querySelector('#potInput'));
    frame.contentWindow.localStorage.removeItem('dealscope-pot-odds-v1');

    const pot = doc.querySelector('#potInput');
    const call = doc.querySelector('#callInput');
    if (!pot || !call) throw new Error('Pot Odds inputs not rendered');

    pot.value = '100';
    pot.dispatchEvent(new Event('input', {bubbles:true}));
    call.value = '30';
    call.dispatchEvent(new Event('input', {bubbles:true}));

    await waitFor(() => {
      const el = doc.querySelector('[data-pot-result="required"]');
      return el && el.textContent === '23.1%';
    });

    const potPlus10 = doc.querySelector('[data-pot-key="pot"][data-pot-step="10"]');
    const potMinus10 = doc.querySelector('[data-pot-key="pot"][data-pot-step="-10"]');
    if (!potPlus10 || !potMinus10) throw new Error('Pot 10-step controls are missing');
    potPlus10.click();
    if (doc.querySelector('#potInput').value !== '110') throw new Error('Pot +10 did not reach 110');
    potMinus10.click();
    if (doc.querySelector('#potInput').value !== '100') throw new Error('Pot -10 did not return to 100');

    const callPlus10 = doc.querySelector('[data-pot-key="call"][data-pot-step="10"]');
    const callMinus10 = doc.querySelector('[data-pot-key="call"][data-pot-step="-10"]');
    if (!callPlus10 || !callMinus10) throw new Error('Call 10-step controls are missing');
    callPlus10.click();
    if (doc.querySelector('#callInput').value !== '40') throw new Error('Call +10 did not reach 40');
    callMinus10.click();
    if (doc.querySelector('#callInput').value !== '30') throw new Error('Call -10 did not return to 30');

    await waitFor(() => {
      const el = doc.querySelector('[data-pot-result="required"]');
      return el && el.textContent === '23.1%';
    });

    const saved = JSON.parse(frame.contentWindow.localStorage.getItem('dealscope-pot-odds-v1') || '{}');
    if (saved.pot !== '100' || saved.call !== '30') throw new Error('Pot Odds values were not persisted');

    const reload = new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
    frame.contentWindow.location.reload();
    await reload;
    const after = frame.contentDocument;
    await waitFor(() => after && after.querySelector('#potOddsBox'));
    const afterDetails = after.querySelector('#potOddsBox');
    if (!afterDetails || afterDetails.open) throw new Error('Pot Odds should reload collapsed');
    afterDetails.querySelector('summary').click();
    await waitFor(() => after.querySelector('#potInput'));

    const potAfter = after.querySelector('#potInput');
    const callAfter = after.querySelector('#callInput');
    const requiredAfter = after.querySelector('[data-pot-result="required"]');
    if (!potAfter || !callAfter || !requiredAfter) throw new Error('Pot Odds did not restore');
    if (potAfter.value !== '100' || callAfter.value !== '30') throw new Error('saved Pot/Call values were not restored');
    if (requiredAfter.textContent !== '23.1%') throw new Error('restored Required Equity is wrong');

    const mini = document.createElement('iframe');
    mini.id = 'mini';
    mini.src = '/minigame/index.html';
    mini.style = 'width:390px;height:1200px;border:0;position:absolute;left:-9999px';
    document.body.appendChild(mini);
    await new Promise(resolve => mini.addEventListener('load', resolve, {once:true}));
    const md = mini.contentDocument;
    await waitFor(() => md && md.querySelector('#turnLabel'), 4000);
    const slider = md.querySelector('#amountSlider');
    const amountValue = md.querySelector('#amount');
    const amountReadout = md.querySelector('#amountReadout');
    const minusStep = md.querySelector('#minusStep');
    const plusStep = md.querySelector('#plusStep');
    const stepLabel = md.querySelector('#stepLabel');
    const betButton = md.querySelector('#betBtn');
    if (!slider || slider.type !== 'range' || !amountValue || !amountReadout) throw new Error('bet sizing slider is missing');
    if (!minusStep || !plusStep || !stepLabel || !betButton) throw new Error('bet sizing adjustment controls are missing');
    slider.value = String(Math.min(Number(slider.max), Number(slider.min) + Number(slider.step)));
    slider.dispatchEvent(new md.defaultView.Event('input', {bubbles:true}));
    if (amountValue.value !== slider.value) throw new Error('slider value did not update action amount');
    if (amountReadout.textContent !== Number(slider.value).toLocaleString('ja-JP')) throw new Error('slider amount readout did not update');
    if (!betButton.textContent.includes(Number(slider.value).toLocaleString('ja-JP'))) throw new Error('bet action label did not follow slider value');
    if (!stepLabel.textContent.includes(Number(slider.step).toLocaleString('ja-JP'))) throw new Error('slider increment label did not update');
    const allEquityPanels = md.querySelectorAll('details.equityDetails');
    if (allEquityPanels.length !== 1 || allEquityPanels[0].getAttribute('data-equity-seat') !== '0') {
      throw new Error('only Player 1 should have an equity foldout');
    }
    const equityToggle = md.querySelector('details.equityDetails[data-equity-seat="0"] summary');
    if (!equityToggle) throw new Error('player equity foldout is missing');
    equityToggle.click();
    let equityResult;
    try {
      equityResult = await waitFor(() => {
        const d = md.querySelector('details.equityDetails[data-equity-seat="0"]');
        const value = d && d.querySelector('[data-equity-result="0"]');
        return value && value.textContent.trim().endsWith('%') && Number.isFinite(parseFloat(value.textContent)) ? value : null;
      }, 10000);
    } catch (e) {
      const d = md.querySelector('details.equityDetails[data-equity-seat="0"]');
      throw new Error('equity timeout: open=' + (d ? d.open : 'missing') + '; summary=' + (d ? d.querySelector('summary').textContent : '') + '; body=' + (d ? d.querySelector('.equityBody').textContent : '') + '; hand=' + (md.querySelector('#info') || {}).textContent + '; status=' + (md.querySelector('#turnLabel') || {}).textContent);
    }
    const equityDetails = md.querySelector('details.equityDetails[data-equity-seat="0"]');
    const equityFill = equityDetails && equityDetails.querySelector('.equityBar i');
    const equityMeta = equityDetails && equityDetails.querySelector('.equityMeta');
    if (!equityDetails.open || !equityFill || !equityMeta) throw new Error('player equity details did not render');
    const equityInfo = equityDetails.querySelector('.equityInfo');
    const equityAside = equityDetails.querySelector('.equityAside');
    const equityBodyStyle = md.defaultView.getComputedStyle(equityDetails.querySelector('.equityBody'));
    if (!equityInfo || !equityAside || equityInfo.querySelectorAll('.equityInfoLine').length < 2) {
      throw new Error('left-side hand detail is missing');
    }
    if (equityBodyStyle.display !== 'grid' || equityBodyStyle.gridTemplateColumns.trim().split(/\s+/).length !== 2) {
      throw new Error('equity and hand detail should use a two-column layout');
    }
    if (!equityMeta.textContent.includes('4,096')) throw new Error('equity trial count is missing');
    if (Math.abs(parseFloat(equityResult.textContent) - parseFloat(equityFill.style.width)) > 0.1) {
      throw new Error('equity bar does not match the calculated percentage');
    }
    const closeEquityToggle = md.querySelector('details.equityDetails[data-equity-seat="0"] summary');
    closeEquityToggle.click();
    await waitFor(() => {
      const d = md.querySelector('details.equityDetails[data-equity-seat="0"]');
      return d && !d.open;
    }, 2000);

    let seenHands = 0;
    const miniStart = performance.now();
    while (seenHands < 3 && performance.now() - miniStart < 12000) {
      await new Promise(resolve => setTimeout(resolve, 40));
      const info = md.querySelector('#info');
      const m = info && info.textContent.match(/Hand #(\d+)/);
      if (m) seenHands = Math.max(seenHands, Number(m[1]));
      const next = md.querySelector('#nextBtn');
      if (next && getComputedStyle(next).display !== 'none') { next.click(); continue; }
      const turn = md.querySelector('#turnLabel');
      if (turn && turn.textContent === 'あなたの番') {
        const call = md.querySelector('#callBtn');
        const fold = md.querySelector('#foldBtn');
        const allin = md.querySelector('#allinBtn');
        if (call && call.textContent.trim() === 'チェック' && fold && !fold.disabled) {
          throw new Error('fold should be disabled when checking is available');
        }
        if (call && !call.disabled) call.click();
        else if (allin && !allin.disabled) allin.click();
      }
    }
    if (seenHands < 3) throw new Error('mini game stalled before Hand 3');

    mini.style.width = '900px';
    const desktopGrid = md.defaultView.getComputedStyle(md.querySelector('#players'));
    if (desktopGrid.gridTemplateColumns.trim().split(/\s+/).length !== 1) {
      throw new Error('desktop players should use compact four-row layout');
    }
    mini.style.width = '390px';
    const mobileGrid = md.defaultView.getComputedStyle(md.querySelector('#players'));
    if (mobileGrid.gridTemplateColumns.trim().split(/\s+/).length !== 2) {
      throw new Error('mobile players should retain two-column layout');
    }

    status.textContent = 'PASS';
    document.title = 'PASS';
  } catch (e) {
    fail(e && e.message ? e.message : String(e));
  }
})();
</script>
</body>
</html>
