<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2f26">
<title>DealScope — ポーカー用語集</title>
<style>
:root{--felt:#0e2f26;--felt2:#143d32;--line:#2a5a4b;--ivory:#f3efe3;--mute:#8fb0a3;--brass:#d8b252;--ink:#1b1b1b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--felt);color:var(--ivory);font-family:system-ui,"Yu Gothic UI","Noto Sans JP",sans-serif}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
a{color:inherit}
main{width:min(920px,100%);margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--mute);text-decoration:none}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:18px;background:var(--felt2);font-size:12px;font-weight:650;text-decoration:none;color:var(--ivory);white-space:nowrap;transition:background .15s,border-color .15s}
.nav a:hover{border-color:var(--brass);background:#1a493b;text-decoration:none}
.nav a[aria-current="page"]{border-color:var(--brass);background:var(--brass);color:var(--ink);font-weight:750}
.nav a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.intro{padding:20px 0 18px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--brass);font-weight:800}
h1{font-size:clamp(24px,4vw,34px);letter-spacing:.01em;margin:7px 0 8px}
.lead{font-size:13px;color:var(--mute);line-height:1.7;margin:0;max-width:680px}
.stats{display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:11px;color:var(--mute)}
.stat b{color:var(--ivory);font-size:13px;margin-right:3px}
.controls{padding:16px 0 13px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px}
.searchWrap{position:relative}
.searchWrap label,.controlLabel{display:block;font-size:10px;letter-spacing:.06em;color:var(--mute);margin:0 0 6px 2px}
.searchWrap input,.filterSelect{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--felt2);color:var(--ivory);padding:0 12px}
.searchWrap input::placeholder{color:#739588}
.filterSelect{appearance:auto}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 0 14px}
.filterCaption{font-size:10px;color:var(--mute);margin-right:3px}
.filterBtn{height:29px;padding:0 10px;border:1px solid var(--line);border-radius:15px;color:var(--mute);background:transparent;font-size:11px;cursor:pointer}
.filterBtn[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:700}
.listHead{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:13px 0 9px}
.listHead h2{font-size:13px;margin:0;font-weight:700}
#count{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
#terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.term{min-width:0;background:var(--felt2);border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:7px}
.termTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.termTitles{min-width:0}
.term h3{font-size:15px;line-height:1.35;margin:0;font-weight:750;overflow-wrap:anywhere}
.termAbbr{color:var(--mute);font-size:.88em;font-weight:650;white-space:nowrap}
.english{font-size:11px;color:var(--mute);line-height:1.4;margin-top:3px;overflow-wrap:anywhere}
.category{display:inline-flex;align-items:center;align-self:flex-start;border:1px solid #376856;border-radius:4px;color:#a7c3b8;padding:2px 5px;font-size:9px;white-space:nowrap}
.stars{font-size:12px;letter-spacing:1px;color:var(--brass);white-space:nowrap;flex-shrink:0}
.stars .empty{color:#45695a}
.definition{font-size:12px;line-height:1.65;margin:0;color:#e4e8df;overflow-wrap:anywhere}
.example{font-size:11px;line-height:1.65;margin:0;padding:8px 9px;border-left:2px solid var(--brass);background:#10372d;color:#e4e8df;border-radius:0 5px 5px 0;overflow-wrap:anywhere}
.example b{color:var(--brass);font-weight:700}
.relatedTerms{font-size:11px;line-height:1.6;margin:0;color:var(--mute)}
.relatedTerms b{color:var(--mute);font-weight:650}
.relatedTerms a{color:var(--brass);text-decoration:none;white-space:nowrap;margin-right:7px}
.relatedTerms a:hover{text-decoration:underline}
.guideLink{margin:0;padding-top:5px;border-top:1px solid var(--line);font-size:11px}.guideLink a{color:var(--brass);text-decoration:none}.guideLink a:hover{text-decoration:underline}
.noResults{grid-column:1/-1;text-align:center;border:1px dashed var(--line);border-radius:9px;padding:30px 15px;color:var(--mute);font-size:13px}
.source{font-size:10px;line-height:1.6;color:var(--mute);border-top:1px solid var(--line);margin-top:22px;padding-top:13px}
.source a{color:var(--brass)}
@media(max-width:620px){
 main{padding:10px 11px 30px}
 .controls{grid-template-columns:minmax(0,1fr);gap:10px}
 #terms{grid-template-columns:minmax(0,1fr)}
 .term{padding:12px}
 .intro{padding-top:13px}
 .nav{gap:5px} .nav a{min-height:32px;padding:0 8px;font-size:11px}
}
@media(min-width:621px) and (max-width:800px){#terms{grid-template-columns:minmax(0,1fr)}}

/* Visual refinement: preserve the existing felt-and-brass identity and all controls. */
:root{
 --felt:#0a241e;--felt2:#12372d;--line:#2c5a4b;--ivory:#f5f1e7;
 --mute:#a0bdb1;--brass:#e0bd68;--ink:#17221d;
 --card-edge:rgba(180,211,194,.15);
}
html,body{
 background:
  radial-gradient(ellipse at 50% -15%,rgba(52,111,84,.32),transparent 52%),
  linear-gradient(180deg,#0c2a22 0%,var(--felt) 55%,#081d18 100%);
}
main{max-width:1000px;padding-top:18px}
.top{margin-bottom:14px}
.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#c0d5ca}
.nav a{
 min-height:36px;padding:0 12px;border-color:rgba(143,176,163,.22);
 background:rgba(20,61,50,.68);backdrop-filter:blur(8px);
 transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.nav a:hover{transform:translateY(-1px);box-shadow:0 5px 14px #06171155}
.nav a[aria-current="page"]{box-shadow:0 3px 12px #d8b25222}
.intro{
 position:relative;padding:25px 0 21px;border-bottom:1px solid rgba(143,176,163,.22);
}
.eyebrow{font-size:10px;letter-spacing:.22em}
h1{font-size:clamp(27px,4.4vw,38px);letter-spacing:.015em;margin:9px 0 10px}
.lead{max-width:720px;font-size:13px;line-height:1.85;color:#b4c9bf}
.stats{gap:8px;margin-top:17px}
.stat{
 border:1px solid rgba(143,176,163,.22);border-radius:999px;padding:7px 12px;
 background:rgba(18,55,45,.62);color:#afc6bb;
}
.stat b{font-size:12px}
.stat:first-child b{color:var(--brass);font-size:15px}
.controls{padding:19px 0 12px;grid-template-columns:minmax(0,1fr) 245px;gap:12px}
.searchWrap label,.controlLabel{font-size:10px;letter-spacing:.09em;font-weight:750;margin-bottom:7px}
.searchWrap input,.filterSelect{
 height:46px;border-radius:11px;border-color:rgba(143,176,163,.28);
 background:rgba(18,55,45,.82);padding:0 14px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 3px 12px rgba(0,0,0,.08);
 transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.searchWrap input:hover,.filterSelect:hover{border-color:rgba(224,189,104,.55)}
.searchWrap input:focus,.filterSelect:focus{
 border-color:var(--brass);background:#153d31;
 box-shadow:0 0 0 3px rgba(224,189,104,.12);outline:none;
}
.searchWrap input::placeholder{color:#8ca99b}
.filterSelect{cursor:pointer}
.filters{gap:7px;padding:2px 0 17px}
.filterCaption{font-size:10px;letter-spacing:.08em;font-weight:750;margin-right:5px}
.filterBtn{
 height:32px;padding:0 12px;border-color:rgba(143,176,163,.24);
 background:rgba(18,55,45,.36);color:#b3c8be;font-size:11px;
 transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;
}
.filterBtn:hover{border-color:rgba(224,189,104,.72);background:rgba(224,189,104,.08);transform:translateY(-1px)}
.filterBtn[aria-pressed=true]{
 background:linear-gradient(135deg,#f0d78f 0%,var(--brass) 100%);
 border-color:#f0d78f;color:#19231d;box-shadow:0 3px 10px rgba(224,189,104,.14);
}
.listHead{border-top-color:rgba(143,176,163,.22);padding:15px 0 11px}
.listHead h2{font-size:14px;letter-spacing:.025em}
#count{padding:4px 9px;border:1px solid rgba(143,176,163,.18);border-radius:999px;background:#12372d80}
#terms{gap:11px}
.term{
 position:relative;overflow:hidden;gap:9px;padding:15px;
 background:linear-gradient(145deg,rgba(22,63,51,.96),rgba(15,47,38,.98));
 border:1px solid var(--card-edge);border-radius:13px;
 box-shadow:0 5px 16px rgba(0,0,0,.09),inset 0 1px 0 rgba(255,255,255,.025);
 transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.term::before{
 content:"";position:absolute;inset:0 auto 0 0;width:2px;
 background:linear-gradient(180deg,rgba(224,189,104,.65),rgba(224,189,104,0));
 opacity:.0;transition:opacity .18s ease;
}
.term:hover{
 transform:translateY(-2px);border-color:rgba(224,189,104,.34);
 box-shadow:0 10px 24px rgba(0,0,0,.17),inset 0 1px 0 rgba(255,255,255,.035);
}
.term:hover::before{opacity:1}
.termTop{gap:10px}
.term h3{font-size:16px;line-height:1.45;letter-spacing:.005em}
.termAbbr{color:#c2d2c8;font-size:.82em}
.english{font-size:11px;color:#9fb8ac;letter-spacing:.015em;margin-top:4px}
.category{
 border-color:rgba(143,190,169,.24);border-radius:999px;
 color:#b8d0c3;background:rgba(143,190,169,.07);
 padding:3px 8px;font-size:10px;font-weight:650;letter-spacing:.015em;
}
.stars{font-size:12px;letter-spacing:1.3px;color:#e7c66e;padding-top:2px}
.stars .empty{color:#426957}
.definition{font-size:12px;line-height:1.8;color:#e9eee6}
.example{
 margin-top:1px;padding:9px 11px;border-left:2px solid #d7b35b;
 border-radius:0 8px 8px 0;background:rgba(7,29,23,.45);
 color:#dce7dc;line-height:1.75;
}
.example b{color:#e7c66e}
.relatedTerms{line-height:1.9;color:#adc3b7}
.relatedTerms b{margin-right:3px;color:#91ad9f}
.relatedTerms a{
 display:inline-block;margin:2px 5px 2px 0;padding:1px 7px;
 border:1px solid rgba(224,189,104,.2);border-radius:999px;
 background:rgba(224,189,104,.055);color:#e2c779;
 transition:background .15s ease,border-color .15s ease;
}
.relatedTerms a:hover{background:rgba(224,189,104,.13);border-color:rgba(224,189,104,.55);text-decoration:none}
.guideLink{padding-top:9px;border-top-color:rgba(143,176,163,.18)}
.guideLink a{color:#e2c779}
.guideLink a:hover{color:#f4dda0}
.noResults{border-color:rgba(143,176,163,.3);background:rgba(18,55,45,.35);padding:36px 15px}
.source{border-top-color:rgba(143,176,163,.2);color:#93afa2}
.source a{color:#e2c779}
@media(max-width:620px){
 main{padding:10px 12px 30px}
 .top{align-items:flex-start;gap:8px}
 .brand{padding-top:8px}
 .nav a{min-height:33px;padding:0 9px}
 .intro{padding:17px 0 16px}
 h1{font-size:28px}
 .controls{grid-template-columns:minmax(0,1fr);padding-top:16px}
 .filters{gap:6px}
 .filterBtn{padding:0 10px}
 #terms{gap:9px}
 .term{padding:14px;border-radius:12px}
 .term h3{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

</style>
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="./">DealScope</a>
    <nav class="nav" aria-label="メインナビゲーション">
      <a href="./">勝率計算</a>
      <a href="./minigame/">▶ ミニゲーム</a>
      <a href="./glossary.html" aria-current="page" aria-label="現在のページ：ポーカー用語集">⌕ 用語集</a>
      <a href="./beginner-guide.html">初心者ガイド</a>
    </nav>
  </header>
  <section class="intro">
    <div class="eyebrow">POKER REFERENCE</div>
    <h1>ポーカー用語集</h1>
    <p class="lead">ポーカーで使われる用語を、日本語・英語・重要度・短い説明で引ける辞典です。日本語と英語のどちらでも検索でき、カテゴリや重要度で絞り込めます。</p>
    <div class="stats">
      <div class="stat"><b id="totalTerms">—</b>用語</div>
      <div class="stat"><b>★★★★★</b>重要度5が最優先</div>
    </div>
  </section>
  <section aria-label="用語の検索と絞り込み">
    <div class="controls">
      <div class="searchWrap">
        <label for="search">用語を検索</label>
        <input id="search" type="search" placeholder="例：サイドポット / equity / OOP" autocomplete="off">
      </div>
      <div>
        <label class="controlLabel" for="category">カテゴリ</label>
        <select id="category" class="filterSelect"><option value="">すべてのカテゴリ</option></select>
      </div>
    </div>
    <div class="filters" role="group" aria-label="重要度で絞り込む">
      <span class="filterCaption">重要度</span>
      <button class="filterBtn" type="button" data-stars="0" aria-pressed="true">すべて</button>
      <button class="filterBtn" type="button" data-stars="5" aria-pressed="false">★★★★★</button>
      <button class="filterBtn" type="button" data-stars="4" aria-pressed="false">★★★★以上</button>
      <button class="filterBtn" type="button" data-stars="3" aria-pressed="false">★★★以上</button>
      <button class="filterBtn" type="button" data-stars="2" aria-pressed="false">★★以上</button>
    </div>
  </section>
  <section aria-labelledby="resultsTitle">
    <div class="listHead"><h2 id="resultsTitle">用語一覧</h2><span id="count" aria-live="polite"></span></div>
    <div id="terms"></div>
  </section>
  <footer class="source">
    重要度は学習の目安としてDealScope側で整理しています。説明は簡潔な独自要約です。<br>
    用語選定の参考：<a href="https://light-three.com/pokerterms/" target="_blank" rel="noopener noreferrer">LightTHREE「ポーカー用語集」</a>
  </footer>
</main>
<script src="./glossary-data.js"></script>
<script>
(function(){
'use strict';
var data=window.DealScopeGlossary;
if(!data||!Array.isArray(data.terms)){document.getElementById('terms').textContent='用語データを読み込めませんでした。ページを再読み込みしてください。';return}
var $=function(id){return document.getElementById(id)};
var search=$('search'),category=$('category'),container=$('terms'),starFilter=0;
try{var initialQuery=new URLSearchParams(window.location.search).get('q');if(initialQuery)search.value=initialQuery}catch(e){}
$('totalTerms').textContent=data.terms.length.toLocaleString('ja-JP');
data.categories.slice().sort(function(a,b){return a.localeCompare(b,'ja')}).forEach(function(cat){
 var option=document.createElement('option');option.value=cat;option.textContent=cat;category.appendChild(option)
});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function stars(n){return '<span class="stars" role="img" aria-label="重要度 '+n+' / 5">'+ '★'.repeat(n)+'<span class="empty">'+'☆'.repeat(5-n)+'</span></span>'}
function guideSection(t){
 var key=[t.abbreviation,t.term,t.english].join(' ').toLocaleLowerCase();
 if(/sb|bb|small blind|big blind|utg|ep|mp|co|btn|button|ポジション|ブラインド|スモールブラインド|ビッグブラインド|アンダーザガン|カットオフ/.test(key))return 'positions';
 if(/check|bet|call|raise|fold|all-in|チェック|ベット|コール|レイズ|フォールド|オールイン/.test(key))return 'actions';
 if(/preflop|flop|turn|river|showdown|プリフロップ|フロップ|ターン|リバー|ショウダウン/.test(key))return 'flow';
 if(/equity|win rate|エクイティ|勝率/.test(key))return 'equity';
 if(/ハンド・役|ロイヤルフラッシュ|ストレート|フラッシュ|ツーペア|ワンペア|フォーカード|フルハウス/.test(key))return 'hands';
 return '';
}
function render(){
 var q=search.value.trim().toLocaleLowerCase();
 var cat=category.value;
 var list=data.terms.filter(function(t){
  return (!cat||t.category===cat)&&(!starFilter||t.stars>=starFilter)&&(!q||[t.term,t.abbreviation,t.english,t.definition,t.category].some(function(v){return String(v||'').toLocaleLowerCase().includes(q)}))
 }).sort(function(a,b){return a.category.localeCompare(b.category,'ja')||a.term.localeCompare(b.term,'ja')||a.english.localeCompare(b.english,'en')});
 $('count').textContent=list.length.toLocaleString('ja-JP')+' / '+data.terms.length.toLocaleString('ja-JP')+'語';
 if(!list.length){container.innerHTML='<div class="noResults">該当する用語がありません。検索語や絞り込み条件を変えてください。</div>';return}
 container.innerHTML=list.map(function(t){
  var section=guideSection(t);var guideLink=section?'<p class="guideLink"><a href="./beginner-guide.html#'+section+'">初心者ガイドで詳しく見る →</a></p>':'';
  var example=t.example?'<p class="example"><b>例：</b>'+escapeHtml(t.example)+'</p>':'';
  var related=t.related&&t.related.length?'<p class="relatedTerms"><b>関連用語：</b>'+t.related.map(function(name){return '<a href="./glossary.html?q='+encodeURIComponent(name)+'">'+escapeHtml(name)+'</a>'}).join('')+'</p>':'';
  return '<article class="term"><div class="termTop"><div class="termTitles"><h3>'+escapeHtml(t.term)+(t.abbreviation?' <span class="termAbbr">（'+escapeHtml(t.abbreviation)+'）</span>':'')+'</h3><div class="english">'+escapeHtml(t.english)+'</div></div>'+stars(t.stars)+'</div><div class="category">'+escapeHtml(t.category)+'</div><p class="definition">'+escapeHtml(t.definition)+'</p>'+example+related+guideLink+'</article>'
 }).join('')
}
search.addEventListener('input',render);
category.addEventListener('change',render);
Array.prototype.forEach.call(document.querySelectorAll('[data-stars]'),function(button){
 button.addEventListener('click',function(){
  starFilter=Number(button.getAttribute('data-stars'));
  Array.prototype.forEach.call(document.querySelectorAll('[data-stars]'),function(other){other.setAttribute('aria-pressed',String(other===button))});
  render()
 })
});
render();
})();
</script>
</body>
</html>
