<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DealScope — 4人トーナメント</title>
<style>
:root{--felt:#0e2f26;--felt2:#143d32;--line:#2a5a4b;--ivory:#f3efe3;--mute:#8fb0a3;--brass:#d8b252;--red:#d55b63}
*{box-sizing:border-box}html,body{margin:0;background:var(--felt);color:var(--ivory);font-family:system-ui,"Yu Gothic UI","Noto Sans JP",sans-serif}
main{max-width:520px;margin:auto;padding:10px 10px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:16px;margin:0}a.backLink{color:var(--mute);text-decoration:none;font-size:12px}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--felt2);padding:7px;margin-bottom:7px}
.info{font-size:12px;color:var(--mute);text-align:center}.msg{text-align:center;font-size:14px;min-height:24px;margin:6px 0;color:var(--ivory)}
.board{min-height:62px;display:flex;align-items:center;justify-content:center;gap:5px;margin:4px 0}.empty{font-size:30px;color:var(--line)}
.card,.cardBack{display:inline-flex;width:38px;height:52px;border-radius:7px;background:var(--ivory);color:#111;align-items:center;justify-content:center;font-size:20px;font-weight:750;box-shadow:0 2px 5px #0005}.card .suit{margin-left:1px}.card.spade .suit{color:#111 !important}.card.heart .suit{color:#d23b45 !important}.card.diamond .suit{color:#3478d4 !important}.card.club .suit{color:#31945a !important}.cardBack{width:38px;height:54px;border:1px solid var(--brass);border-radius:6px;align-items:center;justify-content:center;color:var(--brass);background:#163d31}
.players{display:grid;grid-template-columns:1fr 1fr;gap:5px}.player{position:relative;min-height:104px;border:1px solid var(--line);border-radius:10px;padding:9px;background:#0c2921}.player.hero{border-color:var(--brass)}.player.out{opacity:.42}
.phead{display:flex;align-items:center;gap:5px;font-size:12px}.phead i{width:8px;height:8px;border-radius:50%;display:inline-block}.phead small{margin-left:auto;color:var(--mute);font-size:10px}.cards{height:56px;display:flex;align-items:center;justify-content:center;gap:5px}.back{display:inline-flex;width:38px;height:54px;border:1px solid var(--brass);border-radius:6px;align-items:center;justify-content:center;color:var(--brass);background:#163d31}.stack{text-align:center;font-size:14px;font-weight:700}.stack small{font-size:9px;color:var(--mute);font-weight:400}.made{text-align:center;color:var(--brass);font-size:9px;margin-top:1px}
.log{max-height:125px;overflow:auto;font-size:11px;color:var(--mute);line-height:1.7}.log b{color:var(--ivory)}
.hint{text-align:center;color:var(--mute);font-size:10px;min-height:15px;margin:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.actions button{height:36px;border:1px solid var(--line);border-radius:9px;background:#173e32;color:var(--ivory);font-weight:700}.actions button:disabled{opacity:.3}.actions .fold{color:#e29ba2}.actions .primary{background:var(--brass);color:#17140d;border-color:var(--brass)}
.amount{display:flex;gap:5px;margin-bottom:5px}.amount input{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;background:#092219;color:var(--ivory);padding:0 10px;font-size:14px}.new{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--mute);margin-top:8px}
.note{font-size:9px;color:var(--mute);line-height:1.45;margin-top:7px}
@media(max-width:390px){main{padding-left:8px;padding-right:8px}.card{width:39px;height:56px}.players{gap:5px}.player{padding:7px}.cardBack{width:33px;height:46px}.phead small{font-size:9px}.actions button{height:40px}}

.street{text-align:center;font-size:10px;letter-spacing:.12em;color:var(--brass);font-weight:800;margin-bottom:3px}.tocall{min-width:70px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:10px}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:5px}.presets button{height:28px;border:1px solid var(--line);border-radius:7px;background:#102f27;color:var(--mute);font-size:10px;font-weight:700}.player.current{box-shadow:0 0 0 1px var(--brass) inset}.dealerMark{display:inline-flex;width:15px;height:15px;border-radius:50%;align-items:center;justify-content:center;background:var(--ivory);color:#173e32;font-size:8px;font-weight:900;margin-left:2px}.betline{text-align:center;color:var(--mute);font-size:9px;margin-top:2px}.betline b{color:var(--ivory)}
</style>
</head>
<body>
<main>
<div class="top"><h1>DealScope / 4人トーナメント β</h1><a class="backLink" href="../">← Calculator</a></div>
<div class="panel">
  <div id="street" class="street"></div><div id="info" class="info"></div>
  <div id="msg" class="msg"></div>
  <div id="board" class="board"></div>
  <div id="players" class="players"></div>
</div>
<div class="panel">
  <div class="hint" id="hint"></div>
  <div class="amount"><input id="amount" type="number" step="10" min="20" value="20" aria-label="ベットまたはレイズ額"><span id="toCall" class="tocall"></span></div><div class="presets"><button data-size="min">最小</button><button data-size="half">½P</button><button data-size="pot">POT</button><button data-size="double">2P</button></div>
  <div class="actions">
    <button id="foldBtn" class="fold">フォールド</button>
    <button id="callBtn">チェック</button>
    <button id="betBtn" class="primary">ベット</button>
    <button id="allinBtn">オールイン</button>
  </div>
  <button id="newBtn" class="new">最初からやり直す</button>
</div>
<div class="panel log" id="log"></div>
<p class="note">これはDealScope本体とは別の遊び用ミニゲームです。No-Limit Texas Hold’emの4人Sit & Goとして、ブラインド・ベットラウンド・オールイン・サイドポット・ショーダウンを処理します。CPUはGTO解ではなく、TAG / LAG / タイト・パッシブ / ルーズ・パッシブの傾向を、ハンド強度・ボード・ポット・スタック・確率的な揺らぎに反映します。</p>
</main>
<script src="../engine.js"></script>
<script src="./pots.js?v=20261008-poker3"></script>
<script src="./minigame.js?v=20261008-poker3"></script>
</body>
</html>
